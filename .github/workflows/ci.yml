name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ── Lint / typecheck / build / birim testleri ──────────────────────────────
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 'use server' dosyaları YALNIZ async fonksiyon export edebilir (Next 15). İhlal
      # ÇALIŞMA ANINDA patlar — `next build` YAKALAMAZ — ve o sayfadaki HER server action
      # bozulur (bu hata iki kez üretime çıktı, bkz. commit 9b81c9b). Tip tabanlı tarayıcı
      # build'den ÖNCE koşar: hızlı ve net başarısızlık verir.
      # NOT: adım adı ÇİFT tırnakla sarılı — YAML'de `'` ile BAŞLAYAN bir skalerden sonra düz
      # metin gelemez ("bad indentation of a mapping entry"). Tırnaksız hâli DOSYANIN TAMAMINI
      # ayrıştırılamaz yapıyordu: o durumda bu iş akışındaki HİÇBİR kapı koşmaz (kapıların
      # sessizce hiç çalışmaması, kapı olmamasından beterdir — yanlış güven verir).
      - name: "'use server' export denetimi"
        run: pnpm check:use-server

      # İş akışı dosyalarının kendisi GEÇERLİ YAML mı. Bu adım burada İKİNCİL güvencedir:
      # dosya ayrıştırılamıyorsa hiçbir adım koşmaz, dolayısıyla kapı kendini denetleyemez —
      # ASIL koruma yerel `pnpm typecheck` zincirindedir (her commit öncesi koşulur).
      # Neden gerekti: yukarıdaki adımın adı bir kez tırnaksız yazıldı, ci.yml 19 gün boyunca
      # ayrıştırılamadı ve bu iş akışındaki HİÇBİR kapı koşmadı (hepsi yeşil sanıldı).
      - name: İş akışı YAML denetimi
        run: pnpm check:workflows

      # Nest DI kablolaması: bir sağlayıcının constructor bağımlılığı, modülünden görünmüyorsa
      # API ÇALIŞMA ANINDA hiç boot etmez (`tsc`/`next build` yakalamaz — ikisi de tip düzeyinde
      # geçerlidir). Bu sınıf iki kez yaşandı (SecurityProcessor ve AutocompleteProcessor →
      # SweepAlarmService). Build'den ÖNCE koşar: hata mesajı eksik import'u da söyler.
      - name: Nest modül kablolama denetimi
        run: pnpm check:nest-wiring

      # Kodun okuduğu her çalışma-anı env değişkeni compose'da GEÇİRİLMELİ ve .env.example'de
      # belgeli olmalı. Aksi halde operatör `.env`e yazar, hata çıkmaz, kod sessizce varsayılana
      # düşer ("ayarladım ama çalışmıyor"). Bu sınıf iki kez yaşandı (SITE_SILENCE_HOURS ve
      # admin REQUIRE_AUTH/TZ/APP_VERSION + api RETENTION_*/HMAC_IP_FAIL_LIMIT).
      - name: Ortam değişkeni geçirme denetimi
        run: pnpm check:env

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Birim testleri
        run: pnpm test

      # KABUK BETİKLERİ (denetim O8): üretim DAĞITIM ve YEDEK mantığının TAMAMI `scripts/`
      # altında yaşıyor (deploy.sh rollback, deploy-runner/backup-runner claim döngüleri,
      # backup-drill.sh dump+restore) ama CI bu dosyalara hiç bakmıyordu — bozuk bir betik
      # ancak PROD'da, hem de yedek/rollback gibi en kötü anda ortaya çıkardı. Üstelik
      # backup-drill.sh `# shellcheck disable=` yönergeleri taşıyor: yazar shellcheck'in
      # koştuğunu VARSAYMIŞ, oysa hiç koşmuyordu.
      # `bash -n` zorunlu (sözdizimi); shellcheck varsa uyarı olarak koşar (mevcut betikleri
      # tek seferde temizlemek bu turun kapsamı değil → CI'ı kırmaz, ama görünür olur).
      - name: Kabuk betiği denetimi (bash -n + shellcheck)
        run: |
          set -euo pipefail
          COUNT=0
          while IFS= read -r -d '' f; do
            bash -n "$f"
            COUNT=$((COUNT + 1))
          done < <(find scripts -name '*.sh' -print0)
          echo "bash -n temiz — $COUNT betik"
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -S warning scripts/*.sh || echo "::warning::shellcheck uyarıları var (CI kırılmadı)"
          else
            echo "shellcheck yok — yalnız bash -n koşuldu"
          fi

      # KABUK BETİĞİ EXEC BİTİ (denetim bulgusu): `bash -n` bir dosya 100644 (çalıştırılamaz)
      # olsa da GEÇER — sözdizimi kontrolü çalıştırma iznine bakmaz. Oysa `docs/RUNBOOK-DR.md`
      # ve `docs/RUNBOOK-RELEASE.md` bu betikleri DOĞRUDAN crontab'a koyuyor: exec biti düşerse
      # cron "Permission denied" ile SESSİZCE hiç koşmaz ve arızayı raporlayacak olan da tam o
      # betiğin kendisidir (yedek runner'ı). Bu YAŞANDI: `backup-runner.sh` git'te 100644 idi,
      # runbook harfiyen uygulansa bile gecelik yedek hiç alınmayacaktı; elle düzeltildi.
      # Git INDEX'teki mod denetlenir (VPS'e `git pull` ile inen mod budur; çalışma kopyasının
      # dosya sistemi izni değil). `.js` betikleri KAPSAM DIŞI: `node <dosya>` ile çağrılıyorlar,
      # exec bitine ihtiyaç duymazlar.
      - name: Kabuk betiği exec biti denetimi
        run: |
          set -euo pipefail
          BAD=0; COUNT=0
          while IFS=$'\t' read -r meta file; do
            COUNT=$((COUNT + 1))
            MODE="${meta%% *}"
            if [ "$MODE" != "100755" ]; then
              echo "::error file=$file::$file git'te $MODE — ÇALIŞTIRILAMAZ. Cron bu betiği 'Permission denied' ile sessizce hiç koşturmaz. Düzeltme: git update-index --chmod=+x $file"
              BAD=$((BAD + 1))
            fi
          done < <(git ls-files -s -- 'scripts/*.sh')
          if [ "$COUNT" -eq 0 ]; then
            echo "scripts/ altında .sh bulunamadı — denetim anlamsız, kapı hatalı yapılandırılmış."
            exit 1
          fi
          if [ "$BAD" -gt 0 ]; then
            echo "$BAD betiğin exec biti düşmüş (bkz. docs/RUNBOOK-DR.md §4.3)."
            exit 1
          fi
          echo "exec biti temiz — $COUNT betiğin hepsi 100755"

      # WP EKLENTİSİ PHP SÖZDİZİMİ (denetim bulgusu): eklenti MÜŞTERİ SİTELERİNE dağıtılıyor
      # ama CI onu hiç kontrol etmiyordu — bozuk bir PHP dosyası tüm mağazayı beyaz ekran
      # yapabilirdi (panel testleri PHP'ye dokunmaz). `php -l` her dosyada; ilk hatada CI kırılır.
      - name: WP eklentisi PHP sözdizimi (php -l)
        run: |
          set -euo pipefail
          COUNT=0
          while IFS= read -r -d '' f; do
            php -l "$f" > /dev/null
            COUNT=$((COUNT + 1))
          done < <(find apps/wp-plugin -name '*.php' -print0)
          echo "PHP-lint temiz — $COUNT dosya"

      # WP EKLENTİSİ DAVRANIŞ TESTLERİ (denetim kapsam boşluğu): `php -l` yalnız SÖZDİZİMİ
      # doğruluyordu — eklentinin güvenlik kapıları (panel URL şeması, paket URL doğrulaması,
      # webhook HMAC + kanonik yol, klon tespiti) davranış olarak hiç sınanmıyordu. Oysa bu kod
      # panelin güncelleyicisiyle MÜŞTERİ SİTELERİNE otomatik kurulur: bir regresyon uzaktan ve
      # sessizce yayılır (geçmişte `is_clone()` kalıcı no-op ve `is_secure_panel_url()` kesintisi
      # tam olarak böyle yaşandı). Koşucu saf PHP + sıfır bağımlılık (PHPUnit YOK), WP
      # fonksiyonlarını kendi içinde stub'lar ve başarısızlıkta exit 1 döner.
      - name: WP eklentisi davranış testleri
        run: php apps/wp-plugin/tests/run.php

      # ŞEMA/MIGRATION SAPMASI (denetim bulgusu): drizzle şeması ile migration snapshot'ı
      # ayrışırsa `db:generate` aradaki HER ŞEYİ yeniden yaratan bir migration üretir; prod'a
      # giderse "already exists" ile API BOOT ETMEZ (bu iki kez üretimi kırma eşiğine geldi).
      # CI'da generate koşulur: yeni dosya üretilirse (= sapma) build KIRILIR.
      - name: Migration/şema sapma denetimi
        run: |
          set -euo pipefail
          BEFORE=$(find apps/api/drizzle -maxdepth 1 -name '*.sql' | wc -l)
          pnpm --filter @lisans/api db:generate > /tmp/drizzle-gen.log 2>&1 || {
            cat /tmp/drizzle-gen.log; echo "db:generate BAŞARISIZ"; exit 1;
          }
          AFTER=$(find apps/api/drizzle -maxdepth 1 -name '*.sql' | wc -l)
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "ŞEMA SAPMASI: db:generate yeni migration üretti ($BEFORE → $AFTER)."
            echo "Şema ile snapshot ayrışmış — üretilen dosyayı commit'leyin veya snapshot'ı hizalayın."
            git --no-pager diff --stat -- apps/api/drizzle || true
            exit 1
          fi
          echo "Şema drift YOK (db:generate yeni dosya üretmedi)"

  # ── YARIŞ TESTİ (§16 — zorunlu): çifte atama = 0 ───────────────────────────
  race:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lisanspanel
          POSTGRES_PASSWORD: lisanspanel
          POSTGRES_DB: lisanspanel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lisanspanel -d lisanspanel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # #7 denetim G: rate-limit.service.test.ts REDIS_URL zorunlu — Redis servisi olmadan
      # beforeAll'da patlıyor ve TÜM entegrasyon adımını kırmızıya düşürüyordu (yeni #7/#19/#20
      # testleri otomatik gate ile korunmuyordu). Redis eklenince entegrasyon paketi tam geçer.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://lisanspanel:lisanspanel@localhost:5432/lisanspanel_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Ortak paketi derle
        run: pnpm --filter @lisans/shared build

      - name: Migration'ları uygula
        run: pnpm --filter @lisans/api db:migrate

      - name: Yarış testi — 100 sipariş × 50 stok → çifte atama = 0
        run: pnpm --filter @lisans/api test:race

      - name: Test MASTER_KEY üret (entegrasyon testleri için)
        run: echo "MASTER_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Entegrasyon testleri — createOrder/replacement/recall/KVKK/quota + audit regresyonları
        run: pnpm --filter @lisans/api test:integration
