name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ── Lint / typecheck / build / birim testleri ──────────────────────────────
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Birim testleri
        run: pnpm test

  # ── YARIŞ TESTİ (§16 — zorunlu): çifte atama = 0 ───────────────────────────
  race:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lisanspanel
          POSTGRES_PASSWORD: lisanspanel
          POSTGRES_DB: lisanspanel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lisanspanel -d lisanspanel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # #7 denetim G: rate-limit.service.test.ts REDIS_URL zorunlu — Redis servisi olmadan
      # beforeAll'da patlıyor ve TÜM entegrasyon adımını kırmızıya düşürüyordu (yeni #7/#19/#20
      # testleri otomatik gate ile korunmuyordu). Redis eklenince entegrasyon paketi tam geçer.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://lisanspanel:lisanspanel@localhost:5432/lisanspanel_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Ortak paketi derle
        run: pnpm --filter @lisans/shared build

      - name: Migration'ları uygula
        run: pnpm --filter @lisans/api db:migrate

      - name: Yarış testi — 100 sipariş × 50 stok → çifte atama = 0
        run: pnpm --filter @lisans/api test:race

      - name: Test MASTER_KEY üret (entegrasyon testleri için)
        run: echo "MASTER_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Entegrasyon testleri — createOrder/replacement/recall/KVKK/quota + audit regresyonları
        run: pnpm --filter @lisans/api test:integration
