# Lisans Yönetim Paneli — geliştirme/tek-VPS yığını (MIMARI.md §1).
# PostgreSQL 17 + Redis 7 + API + Admin + Caddy (otomatik TLS).
#
# Kullanım:
#   cp .env.example .env   (değerleri doldur)
#   docker compose up -d --build
#
# API stateless — üretimde `deploy.replicas` ile çoğaltılabilir.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Gün sınırı yerel saate göre (§5 satış kotası + günlük metrikler). Varsayılan Europe/Istanbul;
      # .env'de TZ ile değiştirilebilir. timestamptz mutlak saklanır — TZ yalnız now()/date_trunc/to_char'ı etkiler.
      TZ: ${TZ:-Europe/Istanbul}
      PGTZ: ${TZ:-Europe/Istanbul}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    # Dışa KAPALI (§8) — yalnız iç ağ. Lokal geliştirmede erişim için aç:
    # ports: ['5432:5432']

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # maxmemory: Redis'in HOST RAM'ini tüketip OOM-killer'ı tetiklemesini (komşu prod
    # konteynerini de öldürebilir) engeller. Normal işletimde kullanım ~5-10MB (nonce TTL'li +
    # BullMQ removeOnComplete ile sınırlı); 768mb devasa marj. maxmemory-policy=noeviction
    # BİLİNÇLİ: allkeys-lru gibi bir politika aktif BullMQ işlerini/nonce'ları atabilir (veri
    # kaybı/replay açığı); doldu diye anahtar atmaktansa yazma hatası ver → API katmanı
    # commandTimeout ile bunu HIZLICA fail-fast olarak görür (askıda kalmaz). Yani dolma
    # senaryosu OOM-kill yerine kontrollü, hızlı-başarısız bir degrade'e dönüşür.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '768mb', '--maxmemory-policy', 'noeviction']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    # ports: ['6379:6379']  # yalnız gerekirse
    logging: *default-logging

  # Dev SMTP yakalama sunucusu — gerçek mail göndermez, web UI :8025.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
    logging: *default-logging
    # Web arayüzü lokalde: override ile 127.0.0.1:8025 yayınlanır.

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # JS tarih yerelleştirmesi (günlük digest toLocaleDateString vb.) PG ile aynı TZ'de olsun.
      TZ: ${TZ:-Europe/Istanbul}
      API_PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MASTER_KEY: ${MASTER_KEY}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      # WP eklenti güncelleyicisinin indireceği .zip mutlak URL tabanı (§16). BOŞSA istek
      # host'undan türetilir (tek Caddy arkasında yeterli); CDN/çoklu-proxy topolojisinde
      # gerçek dış API URL'i verilir. GEÇİRİLMEZSE .env'e yazmak sessizce ETKİSİZ kalırdı.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      # İlk admin bootstrap (§8) — admin_users boşsa açılışta owner oluşturur. Opsiyonel.
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
      ADMIN_SEED_NAME: ${ADMIN_SEED_NAME:-}
      ADMIN_SEED_USERNAME: ${ADMIN_SEED_USERNAME:-}
      # Dev varsayılanı Mailpit; ÜRETİMDE .env'e gerçek relay yaz (SMTP_HOST/PORT/SECURE +
      # kimlik isteyen relay için SMTP_USER/SMTP_PASS). Boşsa kimliksiz (Mailpit).
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Lisans Paneli <teslimat@localhost>}
      # Telegram bildirimi (§13/§18) — düşük stok + kritik uyarılar. İKİSİ de SET EDİLİRSE
      # aktif; boşsa bildirim no-op (env-gated). Bot: @BotFather, chat id: @userinfobot.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Günlük digest (§16) sabit-eşik kritik alarm sınırları. Boş bırakılırsa kod içi
      # varsayılan kullanılır (5 / 20 / 5). GEÇİRİLMEZSE .env'deki değer sessizce ETKİSİZDİ.
      DIGEST_FAILED_OUTBOX_THRESHOLD: ${DIGEST_FAILED_OUTBOX_THRESHOLD:-}
      DIGEST_SECURITY_EVENTS_THRESHOLD: ${DIGEST_SECURITY_EVENTS_THRESHOLD:-}
      DIGEST_LOW_STOCK_THRESHOLD: ${DIGEST_LOW_STOCK_THRESHOLD:-}
      # AI-destekli operasyon (§15) — env-gated, VARSAYILAN KAPALI. AI_ENABLED=true VE
      # ANTHROPIC_API_KEY set EDİLİRSE aktif (öneri/rapor uçları); boşsa AI kapalı, sistem
      # AI'sız tam çalışır. Model opsiyonel (varsayılan claude-opus-4-8).
      AI_ENABLED: ${AI_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-4-8}
      # Anthropic API taban URL'i (opsiyonel; boşsa https://api.anthropic.com). Proxy/gateway
      # kurulumları için. GEÇİRİLMEZSE .env'e yazmak sessizce ETKİSİZ kalırdı.
      AI_BASE_URL: ${AI_BASE_URL:-}
      # Sentry hata izleme (§16) — env-gated, VARSAYILAN KAPALI. SENTRY_DSN boşsa SDK init
      # edilmez (tam no-op). DSN kullanıcı sırrıdır. SENTRY_ENVIRONMENT opsiyonel (yoksa NODE_ENV).
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      # ── Dayanıklılık / bakım ayarları (denetim: bunlar GEÇİRİLMİYORDU → .env'e yazmak
      # sessizce ETKİSİZ kalıyordu; kod cömert varsayılana düşüyordu ama operatör ayar
      # yaptığını sanıyordu). Hepsi opsiyonel: boş bırakılırsa kod içi varsayılan geçerli.
      # HMAC uçlarında IP başına BAŞARISIZ auth tavanı (vars. 120) — meşru mağaza etkilenmez.
      HMAC_IP_FAIL_LIMIT: ${HMAC_IP_FAIL_LIMIT:-}
      # Stok import sonrası inline tamamlanacak azami satır; kalanı BullMQ'ya devredilir (vars. 200).
      AUTOCOMPLETE_INLINE_CAP: ${AUTOCOMPLETE_INLINE_CAP:-}
      # Retention (§9/§16) gün eşikleri — boşsa: 180/30/365/365/730/90, audit-all KAPALI.
      RETENTION_FULFILLMENT_DAYS: ${RETENTION_FULFILLMENT_DAYS:-}
      RETENTION_OUTBOX_DAYS: ${RETENTION_OUTBOX_DAYS:-}
      RETENTION_SECURITY_DAYS: ${RETENTION_SECURITY_DAYS:-}
      RETENTION_EMAIL_MASK_DAYS: ${RETENTION_EMAIL_MASK_DAYS:-}
      RETENTION_EMAIL_DELETE_DAYS: ${RETENTION_EMAIL_DELETE_DAYS:-}
      RETENTION_AUDIT_REVEAL_DAYS: ${RETENTION_AUDIT_REVEAL_DAYS:-}
      RETENTION_AUDIT_ALL_DAYS: ${RETENTION_AUDIT_ALL_DAYS:-}
      # Mutabakat taraması penceresi (gün) + tam-tablo koşum anahtarı + sweep alarm dedupe (saat).
      RECONCILE_WINDOW_DAYS: ${RECONCILE_WINDOW_DAYS:-}
      RECONCILE_FULL: ${RECONCILE_FULL:-}
      SWEEP_ALARM_DEDUPE_HOURS: ${SWEEP_ALARM_DEDUPE_HOURS:-}
    # Açılışta migration'ları uygula, sonra servisi başlat.
    command: ['sh', '-c', 'node dist/db/migrate.js && node dist/main.js']
    expose:
      - '3001'
    # Asılı/ölü süreç 'çalışıyor' görünmesin: /v1/health (db+redis) sorgulanır. Degrade (503)
    # unhealthy sayılır → `docker ps` ve restart politikası gerçeği yansıtır.
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"require('http').get({host:'127.0.0.1',port:3001,path:'/v1/health',timeout:4000},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # Konteyner logları json-file ile SINIRSIZ büyüyordu (tek VPS'te disk dolarsa PostgreSQL
    # durur = tüm teslimat durur). Döndürülmüş, üst sınırlı log (x-logging).
    logging: *default-logging

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # Sunucu-taraflı basılan tarihler (sipariş detayı, /releases, /deployments…) API+PG ile
      # AYNI saat diliminde olsun. GEÇİRİLMEZSE konteyner UTC kalır → panelde saatler 3 saat
      # geride görünürdü (gece 01:30 siparişi "önceki gün 22:30").
      TZ: ${TZ:-Europe/Istanbul}
      # Sunucu-taraflı fetch container ağı içinde api'ye gider —
      # NEXT_PUBLIC_ DEĞİL, runtime'da okunur, build'e gömülmez.
      API_URL: http://api:3001
      # Admin token yalnız sunucuda (Next server) — tarayıcıya ASLA düşmez.
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      # Oturum imza sırrı (§8). SET EDİLİRSE auth AKTİF olur → /login zorunlu, kimlik
      # admin_users'a karşı doğrulanır. BOŞSA auth kapalı (panel açık). Üret: openssl rand -hex 32
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Fail-closed emniyet kemeri (§8): true iken SESSION_SECRET yoksa panel AÇILMAZ (503) —
      # kazara sırsız deploy'da panelin sessizce herkese açık kalmasını önler. GEÇİRİLMEZSE
      # .env'e yazmak sessizce ETKİSİZDİ (denetim bulgusu). ÜRETİMDE true önerilir.
      REQUIRE_AUTH: ${REQUIRE_AUTH:-}
      # Panel sürümü (/settings + görünür sürüm). Boşsa admin kendi package.json'ından okur.
      APP_VERSION: ${APP_VERSION:-}
      # Tarayıcı-taraflı çağrılar (ileride) Caddy üzerinden dış URL'e gider.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.localhost}
    expose:
      - '3000'
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"require('http').get({host:'127.0.0.1',port:3000,path:'/login',timeout:4000},r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - admin
    ports:
      - '80:80'
      - '443:443'
    environment:
      # Varsayılanlar bile ayrık olmalı — aynı olursa Caddy crash-loop'a girer.
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-localhost}
      API_DOMAIN: ${API_DOMAIN:-api.localhost}
      # İzole dev/staging alt alan adları (env-gated). Prod .env'de ayarlanmazsa
      # *.localhost'a düşer → dış etki yok. Ayrıksı olmalı (Caddy çakışmasın).
      DEV_ADMIN_DOMAIN: ${DEV_ADMIN_DOMAIN:-dev-admin.localhost}
      DEV_API_DOMAIN: ${DEV_API_DOMAIN:-dev-api.localhost}
      DEV_WP_DOMAIN: ${DEV_WP_DOMAIN:-dev-wp.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
