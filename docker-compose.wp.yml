# ─────────────────────────────────────────────────────────────────────────────
# WordPress + WooCommerce YEREL GELİŞTİRME sitesi — WP eklentisini gerçek bir
# WordPress/WooCommerce kurulumuna karşı geliştirmek/doğrulamak için.
#
# TEK KOMUTLA KUR:  bash scripts/wp-dev.sh
#   (panel yığınını + bu WP yığınını ayağa kaldırır, WP+Woo kurar, eklentiyi aktive
#    eder, panelde site oluşturup api_key/hmac_secret'ı WP'ye bağlar.)
#
# Elle:  docker compose up -d            # önce panel (ağı bu yaratır)
#        docker compose -f docker-compose.wp.yml up -d
#
# Erişim:  WP sitesi → http://localhost:8090   (yönetici: /wp-admin)
# Ağ: panel ağına (external) bağlanır → WP eklentisi paneli `http://api:3001`
#     olarak görür; panel webhook'u WP'yi `http://wordpress` olarak görür.
# ─────────────────────────────────────────────────────────────────────────────

services:
  wp-mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp
      MYSQL_PASSWORD: wp
    volumes:
      - wp_mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot']
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:6-php8.2-apache
    restart: unless-stopped
    depends_on:
      wp-mysql:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: wp-mysql
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wordpress
      # wp-config.php'ye enjekte edilen ek tanımlar (geliştirme kolaylığı):
      #  - WP_HOME/WP_SITEURL: site 8090 portunda; WP kendi adresini bilsin.
      #  - WP_DEBUG*: hata ayıklama logu (wp-content/debug.log).
      #  - JETLISANS_PANEL_URL: eklentinin paneli gördüğü sabit adres (SIR DEĞİL).
      #    api_key/hmac_secret SIRLARı burada DURMAZ — scripts/wp-dev.sh panelde site
      #    oluşturup `wp config set` ile enjekte eder (site-özel, güvenli).
      # WP_SITE_URL / PANEL_NETWORK / WP_BIND ortam değişkenleriyle override edilebilir
      # (yerel varsayılan = localhost:8090; VPS izole dev'de farklı URL/ağ/port).
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${WP_SITE_URL:-http://localhost:8090}');
        define('WP_SITEURL', '${WP_SITE_URL:-http://localhost:8090}');
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('FS_METHOD', 'direct');
        define('JETLISANS_PANEL_URL', 'http://api:3001');
    volumes:
      - wp_data:/var/www/html
      # Eklenti KAYNAKTAN bind-mount (salt-okunur): host'ta düzenle → WP'de anında
      # yansır; WP eklenti dosyalarını DEĞİŞTİREMEZ (kaynak tek doğruluk).
      - ./apps/wp-plugin/jetlisans:/var/www/html/wp-content/plugins/jetlisans:ro
    ports:
      - '${WP_BIND:-127.0.0.1:8090}:80'

  # WP-CLI — provizyon/otomasyon (scripts/wp-dev.sh bunu kullanır). Boşta bekler.
  wpcli:
    image: wordpress:cli-php8.2
    depends_on:
      wordpress:
        condition: service_started
    user: '33:33'
    environment:
      WORDPRESS_DB_HOST: wp-mysql
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
      - ./apps/wp-plugin/jetlisans:/var/www/html/wp-content/plugins/jetlisans:ro
    entrypoint: ['tail', '-f', '/dev/null']

volumes:
  wp_mysql:
  wp_data:

networks:
  default:
    external: true
    # Panel yığınının ağı. Yerel: lisans-yonetim-paneli_default. İzole dev (VPS): lisansdev_default.
    name: ${PANEL_NETWORK:-lisans-yonetim-paneli_default}
